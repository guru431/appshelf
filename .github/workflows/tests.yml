# Быстрый набор на Linux: сервер — Linux, а локально тесты идут на Windows, где flock, killpg и права файлов
# (tests/test_ipatool.py, skipif posix) не исполняются.
name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # как на сервере (Debian 13)
      - run: pip install -e ".[test]"
      - run: pytest -q
  # Офлайн-проверки подписи APK и каталога F-Droid настоящими apksigner и JDK из apt того же выпуска Debian, что на
  # сервере (deploy/install.sh): разбор вывода apksigner («Signer #N», «Signer (minSdkVersion=…)») зависит от его версии.
  # apt + тесты — пара минут, параллельно быстрому набору.
  verifiers:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            apksigner default-jdk-headless python3 python3-venv ca-certificates git
      - uses: actions/checkout@v5
      - run: python3 -m venv /opt/venv && /opt/venv/bin/pip install -q -e ".[test]"
      - run: /opt/venv/bin/pytest -q -m integration tests/test_apk_verification.py tests/test_fdroid_verification.py
