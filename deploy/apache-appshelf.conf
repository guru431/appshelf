# appshelf — своя полка приложений iPhone. Образец vhost: домен, сертификат, порт и путь архива — свои.
# Путь архива = APPSHELF_PUB из appshelf.env (или /var/lib/appshelf/pub, если он не задан).
#############
<VirtualHost *:443>
    ServerName apps.example.com
    CustomLog "/var/log/apache2/apps.example.com-access.log" combined
    ErrorLog "/var/log/apache2/apps.example.com-errors.log"
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/apps.example.com/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/apps.example.com/privkey.pem
    SSLCertificateChainFile  /etc/letsencrypt/live/apps.example.com/chain.pem
    # manifest и IPA — без пароля, путь с 32-hex токеном: iOS не проходит авторизацию при OTA-установке
    # Архив может лежать на сетевой ФС (CIFS): sendfile/mmap с неё отдают битые файлы
    Alias /d/ /mnt/archive/appshelf/pub/
    <Directory "/mnt/archive/appshelf/pub">
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        EnableSendfile Off
        EnableMMAP Off
        AddType text/xml .plist
        AddType application/octet-stream .ipa
    </Directory>
    <Location />
        # вход в Apple ID ждёт ipatool до 120 с
        ProxyPass "unix:/run/appshelf/web.sock|http://localhost/" retry=1 timeout=180
        ProxyPassReverse "http://localhost/"
        Header always set X-Frame-Options "DENY"
        # пароль — в приложении (форма /login + cookie): PWA на iPhone не показывает окно Basic Auth
        Require all granted
    </Location>
    # более частные Location — после общего: они его переопределяют
    <Location /d/>
        ProxyPass "!"
        Require all granted
    </Location>
    <Location /healthz>
        Require all granted
    </Location>
    # манифест PWA и иконка экрана «Домой»: iOS и браузеры берут их без пароля
    <Location /pwa/>
        Require all granted
    </Location>
</VirtualHost>
