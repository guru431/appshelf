{% extends "base.html" %}
{% block main %}
<p>{{ question }}</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% if refused %}<p><a href="{{ cancel }}">Назад</a></p>
{% else %}<form method="post" action="{{ action }}" style="display:flex;gap:12px;align-items:center">
  <button>{{ button }}</button><a href="{{ cancel }}">Отмена</a></form>{% endif %}
{% endblock %}
