<div class="upload-feedback" data-upload-feedback hidden>
  <progress data-upload-progress max="100" value="0" aria-label="Отправка APK на сервер"></progress>
  <p class="meta" data-upload-status role="status" aria-live="polite" aria-atomic="true"></p>
  <div class="upload-controls" data-upload-controls hidden>
    <button type="button" class="secondary sm" data-upload-pause>Пауза</button>
    <button type="button" class="secondary sm" data-upload-cancel>Отменить</button>
  </div>
  <p class="hint" data-upload-background hidden>Отправляем частями. Если Android усыпит браузер, продолжим при возвращении. Прогресс хранится 7 дней.</p>
</div>
